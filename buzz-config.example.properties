# Buzz API sample configuration.
# Copy this file to "buzz-config.properties" and fill in the values, or run:
#     groovy scripts/RunBuzzSample.groovy
# which generates "buzz-config.properties" for you.
#
# "buzz-config.properties" is gitignored — never commit it.

# Buzz API server URL (no trailing slash).
serverUrl=https://api.agilixbuzz.com

# Included in the User-Agent header so Agilix support can identify your integration.
contactInformation=+https://example.com/; admin@example.com
applicationInformation=MyApp

# The userid of the Application Identity account (the OAuth client_id).
oauthUserId=12345678

# The key id (kid) chosen when the public key was registered with Buzz.
oauthKid=2025-q2

# Path to the RSA private key (PKCS#8 PEM).  Keep this file secret; never commit it.
privateKeyPath=private_key.pem

# Alternatively, load the key from a PKCS#12 keystore instead of a PEM file
# (the idiomatic Java way to avoid a plaintext key on disk).  If keystorePath is
# set it takes precedence over privateKeyPath.
#keystorePath=buzz-oauth.p12
#keystorePassword=changeit
#keyAlias=buzz
